<!doctype html>
<html lang="en">
<head>
	<script>
		(function () {
			// 主题初始化
			try {
				const rawTheme = localStorage.getItem("theme");
				const isDark = rawTheme
					? JSON.parse(rawTheme)?.state?.theme === "dark"
					: window.matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.classList.toggle("dark", isDark);
			} catch (err) {
				console.warn("Failed to read theme", err);
			}

			// 语言初始化
			try {
				const rawLang = localStorage.getItem("i18n");
				const lang = rawLang
					? JSON.parse(rawLang)?.state?.language || "en"
					: "en";
				document.documentElement.lang = lang === "cn" ? "zh-CN" : "en";
				document.title = lang === "cn" ? "主页" : "Home Page";
			} catch (err) {
				console.warn("Failed to read language", err);
				document.title = "Home Page";
				document.documentElement.lang = "en";
			}
		})();

	</script>
	<meta charset="UTF-8"/>
	<link rel="icon" type="image/*" href="./website-icon.png"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Home Page</title>

</head>
<body>
<script>
  (function () {
    try {
      const rawBg = localStorage.getItem("bg");
      const html = document.documentElement;
      const body = document.body;

      // 先重置所有可能的内联样式
      html.style.minHeight = "";
      body.style.minHeight = "";
      body.style.margin = "";
      body.style.padding = "";
      body.style.background = "";
      html.style.backgroundImage = "none";
      html.style.backgroundSize = "";
      html.style.backgroundRepeat = "";
      html.style.backgroundPosition = "";
      html.style.backgroundAttachment = "";

      if (rawBg) {
        const bgData = JSON.parse(rawBg);
        const state = bgData?.state || {};
        const bgImg = state.bgImg;
		const bgType = state.bgType;

		if (bgType === "custom") {
			if (bgImg) {
				html.style.backgroundImage = `url("${bgImg}")`;
				html.style.backgroundSize = state.bgSize || "auto";
				html.style.backgroundPosition = state.bgCenter ? "center" : "top left";
				html.style.backgroundRepeat = state.bgRepeat ? "repeat" : "no-repeat";

				html.style.minHeight = "100vh";
				body.style.minHeight = "100vh";
				body.style.margin = "0";
				body.style.padding = "0";
				body.style.background = "transparent";
			}
		} else if (bgType === "bing") {
			html.style.backgroundImage = `url(https://bing.biturl.top/?resolution=1920&format=image)`;
			html.style.backgroundSize = "cover";
			html.style.backgroundRepeat = "no-repeat";
			html.style.backgroundPosition = "center";

			html.style.minHeight = "100vh";
			body.style.minHeight = "100vh";
			body.style.margin = "0";
			body.style.padding = "0";
			body.style.background = "transparent";
		} else if (bgType === "default") {
			if (bgImg) {
				html.style.backgroundImage = `url("${bgImg}")`;
				html.style.backgroundSize = "auto";
				html.style.backgroundRepeat = "repeat";
				html.style.backgroundPosition = "top left";

				html.style.minHeight = "100vh";
				body.style.minHeight = "100vh";
				body.style.margin = "0";
				body.style.padding = "0";
				body.style.background = "transparent";
			}
		}
        // 若无有效背景，保持重置状态，让 CSS 类 bg-background 生效
      }
    } catch (err) {
      console.warn("Failed to read bg", err);
    }
  })();
</script>

<div id="root"></div>
</body>
</html>
